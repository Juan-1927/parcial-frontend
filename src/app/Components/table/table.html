@if (error()) {
  <p class="estado estado-error" role="alert">{{ error() }}</p>
}

<div class="mat-elevation-z2 contenedor">
  <table mat-table class="full-width-table" [dataSource]="datos() ?? []" [attr.aria-label]="etiqueta()">
    @for (columna of columnas(); track columna) {
      <ng-container [matColumnDef]="columna">
        <th mat-header-cell *matHeaderCellDef>{{ titulo(columna) }}</th>
        <td mat-cell *matCellDef="let row">{{ row[columna] }}</td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="columnas()"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas()"></tr>
  </table>

  @if (datos() === undefined && !error()) {
    <p class="estado">Cargando...</p>
  } @else if (datos()?.length === 0) {
    <p class="estado">Todavía no hay registros.</p>
  }
</div>
